name: "circleseeker"
description: Detect and characterize eccDNA from PacBio HiFi long-read sequencing data
keywords:
  - eccDNA
  - long-read
  - circular-dna
  - hifi
tools:
  - circleseeker:
      description: Comprehensive detection and characterization of extrachromosomal circular DNA (eccDNA) from PacBio HiFi sequencing data
      homepage: https://github.com/YaoxinBio/CircleSeeker
      documentation: https://github.com/YaoxinBio/CircleSeeker#readme
      tool_dev_url: https://github.com/YaoxinBio/CircleSeeker
      licence: ["GPL-3.0-only"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: Input HiFi reads (FASTA or FASTQ, gz or plain)
        pattern: "*.{fa,fasta,fastq,fq,fa.gz,fasta.gz,fastq.gz,fq.gz}"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'ref' ]`
    - fasta:
        type: file
        description: Reference genome FASTA file
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"

output:
  - merged:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_eccDNA_summary.csv":
          type: file
          description: All detected eccDNA combined in a single CSV table (v1.1.x summary format)
          pattern: "*_eccDNA_summary.csv"
  - bed:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.circleseeker.bed":
          type: file
          description: BED6+read_count table derived from the merged CSV
          pattern: "*.circleseeker.bed"
  - summary:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_summary.txt":
          type: file
          description: Summary statistics text report
          pattern: "*_summary.txt"
  - report:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_report.html":
          type: file
          description: Interactive HTML report
          pattern: "*_report.html"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions

authors:
  - "@SiYangming"
maintainers:
  - "@SiYangming"
