name: "ecc_finder_asm_ont"
description: Assemble eccDNA sequences from Nanopore long reads
keywords:
  - eccDNA
  - long-read
  - ONT
  - assembly
tools:
  - ecc_finder:
      description: A robust and accurate detection tool to detect eccDNA using Illumina and ONT sequencing
      homepage: https://github.com/njaupan/ecc_finder
      documentation: https://github.com/njaupan/ecc_finder/wiki
      tool_dev_url: https://github.com/njaupan/ecc_finder
      doi: "10.3389/fpls.2021.743742"
      licence: ["GPL-3.0"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - query:
        type: file
        description: Query fastq/fasta file (uncompressed or bgzipped)
        pattern: "*.{fastq,fq,fasta,fa,fastq.gz,fq.gz,fasta.gz,fa.gz}"

output:
  - fasta:
      - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.fasta":
          type: file
          description: Assembled eccDNA sequences in FASTA format
          pattern: "*ecc.asm.ont.fasta"
  - versions_ecc_finder:
      - "${task.process}":
          type: string
          description: Process name
      - ecc_finder:
          type: string
          description: Tool name
      - version:
          type: string
          description: Tool version

authors:
  - "@SiYangming"
maintainers:
  - "@SiYangming"
