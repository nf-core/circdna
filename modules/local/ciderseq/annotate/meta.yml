name: "ciderseq_annotate"
description: "CIDER-Seq2 annotate step: tBLASTn-based ORF/gene annotation of (circular) reads."
keywords:
  - eccDNA
  - ciderseq
  - blast
  - annotation
  - tblastn
tools:
  - "ciderseq2":
      description: "CIDER-Seq data analysis software for full-length sequencing of circular DNA viruses and extra-chromosomal circular DNA (eccDNA)."
      homepage: "https://github.com/devang-mehta/ciderseq2"
      documentation: "https://github.com/devang-mehta/ciderseq2"
      licence: ["GPL-3.0-only"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: De-concatenated reads (FASTA)
        pattern: "*.fa"
  - - config:
        type: file
        description: CIDER-Seq2 config JSON (annotate.tblastndb is resolved by basename inside protein_db)
        pattern: "*.json"
  - - protein_db:
        type: file
        description: Directory (or db file) of the tblastn protein database
output:
  - annotation:
      - - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
        - "${prefix}.json":
            type: file
            description: Per-read ORF annotation (JSON)
            pattern: "*.json"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
