name: "ciderseq_phase"
description: "CIDER-Seq2 phase step: phase annotated circular sequences to a user-defined start position."
keywords:
  - eccDNA
  - ciderseq
  - phasing
tools:
  - "ciderseq2":
      description: "CIDER-Seq data analysis software for full-length sequencing of circular DNA viruses and extra-chromosomal circular DNA (eccDNA)."
      homepage: "https://github.com/devang-mehta/ciderseq2"
      documentation: "https://github.com/devang-mehta/ciderseq2"
      licence: ["GPL-3.0-only"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - deconcat:
        type: file
        description: De-concatenated reads (FASTA)
        pattern: "*.fa"
  - - annotation:
        type: file
        description: Annotation JSON produced by the annotate step
        pattern: "*.json"
  - - config:
        type: file
        description: CIDER-Seq2 config JSON (phase settings)
        pattern: "*.json"
  - - genome:
        type: string
        description: Target genome name (key of phase.phasegenomes)
output:
  - phased:
      - - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
        - "${prefix}.{fasta,gb,genbank,fa}":
            type: file
            description: Phased sequences in the configured output formats
            pattern: "*.{fasta,gb,genbank,fa}"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
