name: "ciderseq_separate"
description: "CIDER-Seq2 separate step: BLASTn-based read binning against a reference blast database."
keywords:
  - eccDNA
  - ciderseq
  - blast
  - separation
tools:
  - "ciderseq2":
      description: "CIDER-Seq data analysis software for full-length sequencing of circular DNA viruses and extra-chromosomal circular DNA (eccDNA)."
      homepage: "https://github.com/devang-mehta/ciderseq2"
      documentation: "https://github.com/devang-mehta/ciderseq2"
      licence: ["GPL-3.0-only"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: Input reads (FASTA or FASTQ)
        pattern: "*.{fasta,fa,fastq,fq}"
  - - config:
        type: file
        description: CIDER-Seq2 config JSON (separate.blastndb is resolved by basename inside blastdb)
        pattern: "*.json"
  - - blastdb:
        type: file
        description: Directory (or db file) of the blastn database
output:
  - separated:
      - - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
        - "${prefix}.*.fa":
            type: file
            description: Per-genome binned reads (including 'nohit')
            pattern: "*.fa"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
