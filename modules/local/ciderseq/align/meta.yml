name: "ciderseq_align"
description: "CIDER-Seq2 align step: MUSCLE-based end trimming of reads binned to one target genome."
keywords:
  - eccDNA
  - ciderseq
  - muscle
  - alignment
tools:
  - "ciderseq2":
      description: "CIDER-Seq data analysis software for full-length sequencing of circular DNA viruses and extra-chromosomal circular DNA (eccDNA)."
      homepage: "https://github.com/devang-mehta/ciderseq2"
      documentation: "https://github.com/devang-mehta/ciderseq2"
      licence: ["GPL-3.0-only"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: Reads binned to one genome (FASTA)
        pattern: "*.fa"
  - - config:
        type: file
        description: CIDER-Seq2 config JSON (align.targets.<genome> is resolved by basename inside targets)
        pattern: "*.json"
  - - targets:
        type: file
        description: Directory (or file) of the align target fasta files
  - - genome:
        type: string
        description: Target genome name (key of align.targets)
output:
  - aligned:
      - - meta:
            type: map
            description: |
              Groovy Map containing sample information
              e.g. `[ id:'sample1' ]`
        - "${prefix}.fa":
            type: file
            description: Trimmed reads for the target genome
            pattern: "*.fa"
  - versions:
      - "versions.yml":
          type: file
          description: File containing software versions
          pattern: "versions.yml"
authors:
  - "@siyangming"
maintainers:
  - "@siyangming"
